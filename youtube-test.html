<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Heart English · YouTube Clip Test</title>
<style>
body{margin:0;background:#f6f6f3;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px}.brand{font-size:12px;font-weight:800;letter-spacing:.08em;color:#777}.card{background:#fff;border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 10px 28px rgba(0,0,0,.06)}h1{font-size:26px;margin:6px 0}h2{font-size:19px;margin:0 0 8px}.sub{color:#666;line-height:1.5}.player{aspect-ratio:16/9;background:#111;border-radius:15px;overflow:hidden;margin-top:12px}.player>div,.player iframe{width:100%;height:100%}.buttons{display:grid;gap:9px;margin-top:12px}button{border:0;border-radius:14px;padding:13px 14px;background:#202020;color:#fff;font-weight:750;font-size:14px;cursor:pointer}.secondary{background:#ececea;color:#222}.status{margin-top:10px;font-size:12px;color:#777;line-height:1.45}.expression{font-size:22px;font-weight:800;margin-top:12px}.ko{color:#666;font-size:14px}.ok{background:#eff4ec;border-radius:14px;padding:12px;margin-top:14px;font-size:13px;line-height:1.55}</style>
</head>
<body>
<div class="wrap">
  <div class="brand">HEART ENGLISH · YOUTUBE CLIP TEST</div>
  <h1>짧은 영상 학습 기술 테스트</h1>
  <div class="sub">YouTube 원본을 다운로드하지 않고 특정 시작·종료 구간만 재생합니다.</div>
  <div class="card">
    <h2>Test A · YouTube 공식 예제</h2>
    <div class="player"><div id="playerA"></div></div>
    <div class="buttons"><button onclick="playSegment('A',5,12)">▶ 5초 → 12초 재생</button></div>
    <div id="statusA" class="status">대기 중</div>
  </div>
  <div class="card">
    <h2>Test B · see eye to eye</h2>
    <div class="expression">see eye to eye</div><div class="ko">의견이 일치하다 · 같은 생각을 하다</div>
    <div class="player"><div id="playerB"></div></div>
    <div class="buttons">
      <button onclick="playSegment('B',423.09,435.085)">▶ 문맥 포함 7:03 → 7:15</button>
      <button class="secondary" onclick="playSegment('B',432.418,435.085)">▶ 표현 부분만 7:12 → 7:15</button>
      <button class="secondary" onclick="playSegment('B',435.109,455.041)">▶ 뒤 20초 이어보기</button>
    </div>
    <div id="statusB" class="status">대기 중</div>
  </div>
  <div class="ok">A와 B 모두 되면 Heart English의 Cake식 짧은 영상 학습에 그대로 사용할 수 있습니다.</div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let playerA,playerB,timerA,timerB;
function onYouTubeIframeAPIReady(){const common={playsinline:1,rel:0,origin:location.origin};playerA=new YT.Player('playerA',{videoId:'M7lc1UVf-VE',playerVars:common,events:{onReady:()=>setStatus('A','플레이어 준비 완료'),onError:e=>setStatus('A','YouTube 오류 '+e.data)}});playerB=new YT.Player('playerB',{videoId:'3boKz0Exros',playerVars:common,events:{onReady:()=>setStatus('B','플레이어 준비 완료'),onError:e=>setStatus('B','YouTube 오류 '+e.data)}})}
function setStatus(w,m){document.getElementById('status'+w).textContent=m}
function playSegment(w,s,e){const p=w==='A'?playerA:playerB;if(!p||!p.loadVideoById){setStatus(w,'플레이어가 아직 준비되지 않았습니다.');return}if(w==='A'&&timerA)clearInterval(timerA);if(w==='B'&&timerB)clearInterval(timerB);const id=w==='A'?'M7lc1UVf-VE':'3boKz0Exros';p.loadVideoById({videoId:id,startSeconds:s,endSeconds:e});setStatus(w,fmt(s)+' → '+fmt(e)+' 재생 중');const t=setInterval(()=>{try{if(p.getCurrentTime()>=e-.08){p.pauseVideo();clearInterval(t);setStatus(w,fmt(s)+' → '+fmt(e)+' 완료')}}catch(x){}},50);if(w==='A')timerA=t;else timerB=t}
function fmt(s){const m=Math.floor(s/60),sec=(s-m*60).toFixed(2).padStart(5,'0');return m+':'+sec}
</script>
</body>
</html>
